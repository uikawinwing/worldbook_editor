name: rename-wbm-once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/rename-wbm-once.yaml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Rename old UI namespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('src/worldbook_editor/ui/styles.ts'),
              Path('src/worldbook_editor/ui/view.ts'),
              Path('src/worldbook_editor/ui/manager.ts'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('wbm', 'wbe'), encoding='utf-8')
          PY

          rm .github/workflows/rename-wbm-once.yaml

      - name: Commit one-time namespace cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rename UI namespace to wbe"
          git push origin HEAD:dev
